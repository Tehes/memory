<!DOCTYPE html>
<html lang="en">
	<head>
		<!-- Meta Tags -->
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Memory</title>
		<meta name="description" content="This is a Memory Game, built with HTML5, CSS and Javascript" />
		<meta name="keywords" content="Memory, Game" />
		<meta name="author" content="Tino Sabetta" />

		<!-- Web App -->
		<link rel="manifest" href="manifest.json">
		<meta name="apple-mobile-web-app-capable" content="yes">
		<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
		<link rel="apple-touch-icon" href="assets/app-icon/app-icon.png">
		<!-- Splash Screens -->
		<link href="assets/splashscreens/iphone6_splash.png"
			media="(device-width: 375px) and (device-height: 667px) and (-webkit-device-pixel-ratio: 2)"
			rel="apple-touch-startup-image" />
		<link href="assets/splashscreens/iphoneplus_splash.png"
			media="(device-width: 621px) and (device-height: 1104px) and (-webkit-device-pixel-ratio: 3)"
			rel="apple-touch-startup-image" />
		<link href="assets/splashscreens/iphonex_splash.png"
			media="(device-width: 375px) and (device-height: 812px) and (-webkit-device-pixel-ratio: 3)"
			rel="apple-touch-startup-image" />
		<link href="assets/splashscreens/ipad_splash.png"
			media="(device-width: 768px) and (device-height: 1024px) and (-webkit-device-pixel-ratio: 2)"
			rel="apple-touch-startup-image" />
		<link href="assets/splashscreens/ipadpro1_splash.png"
			media="(device-width: 834px) and (device-height: 1112px) and (-webkit-device-pixel-ratio: 2)"
			rel="apple-touch-startup-image" />
		<link href="assets/splashscreens/ipadpro2_splash.png"
			media="(device-width: 1024px) and (device-height: 1366px) and (-webkit-device-pixel-ratio: 2)"
			rel="apple-touch-startup-image" />

		<!-- Favicon -->
		<link rel="icon" href="icons/favicon.png" type="image/png" />

		<!-- CSS -->
		<link href="https://fonts.googleapis.com/css?family=Fjalla+One" rel="stylesheet">
		<link rel="stylesheet" href="css/style.css" media="screen" />

		<!-- JavaScript -->
		<script defer src="https://cloud.umami.is/script.js"
			data-website-id="2392a451-203c-4d8a-a4f5-bd7d06f832af"></script>
		<script type="module" src="js/app.js"></script>
	</head>

	<body>
		<header>
			<h1>Memory</h1>
			<label class="menu-picker" for="theme">
				<select id="theme"></select>
			</label>
			<span class="menu-picker">
				<span id="players" class="segmented-toggle">
					<input type="radio" id="players1" name="players" value="1" checked>
					<label for="players1">1 Player</label>
					<input type="radio" id="players2" name="players" value="2">
					<label for="players2">2 Players</label>
				</span>
			</span>
			<button id="restart" type="button">Restart</button>
			<div id="time">Time: <span>00:00</span></div>
			<div id="best">Best: <span>--:--</span></div>
			<div id="pairs_1" class="hidden active">Player 1: <span>0</span></div>
			<div id="pairs_2" class="hidden">Player 2: <span>0</span></div>
		</header>
		<main id="GameGrid"></main>

		<footer>
			<div class="social-links">
				<a href="https://www.threads.com/@tehes83" title="Threads">
					<img src="svg/threads.svg" alt="Threads" width="24" height="24">
				</a>
				<a href="https://github.com/Tehes" title="GitHub">
					<img src="svg/github.svg" alt="GitHub" width="24" height="24">
				</a>
			</div>
			<div id="themeCredit">Icons from <a></a></div>
		</footer>
		<template id="cardTemplate">
			<div class="card">
				<div class="front cardface"></div>
				<div class="back cardface"></div>
			</div>
		</template>
	</body>
</html>
